name: ModelOps360 CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Node.js & TypeScript Quality Suite
  # ============================================================================
  node-suite:
    name: Node.js & React Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type checking (tsc --noEmit)
        run: npm run lint

      - name: Run Express Server test suite (19 Phases)
        run: npm test

      - name: Verify Vite production build
        run: npm run build

  # ============================================================================
  # 2. Python ML & FastAPI Test Suite
  # ============================================================================
  python-suite:
    name: Python ML & Backend Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax & compilation
        run: |
          python -m py_compile ml/**/*.py
          python -m py_compile backend/**/*.py

      - name: Run Pytest test suite (ML + Backend + Lightweight Jobs)
        run: |
          python -m pytest ml/tests/ backend/tests/ -v --tb=short

  # ============================================================================
  # 3. Docker Build & Compose Validation
  # ============================================================================
  docker-validation:
    name: Dockerfile & Compose Smoke Validation
    needs: [node-suite, python-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose configuration
        run: |
          docker compose config --quiet

      - name: Build main application Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: modelops360-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build FastAPI backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: modelops360-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
